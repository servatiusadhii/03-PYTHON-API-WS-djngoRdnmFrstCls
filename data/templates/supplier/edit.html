{% extends 'layouts/base.html' %}
{% load static %}
{% block title %}Edit Supplier{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/supplier/edit.css' %}">
{% endblock %}

{% block content %}

<style>
/* ================= PAGE ================= */

.page-container{
display:flex;
justify-content:center;
align-items:flex-start;
height:100%;
padding:20px 10px;
}

/* ================= CARD ================= */

.form-card{
width:100%;
max-width:1100px;
background:#ffffff;
border-radius:14px;
padding:28px;
box-shadow:0 12px 35px rgba(0,0,0,0.08);
transition:0.3s;
}

/* ================= HEADER ================= */

.form-header{
margin-bottom:18px;
}

.form-header h2{
font-size:26px;
font-weight:700;
color:#1f2937;
margin-bottom:4px;
}

.form-header p{
font-size:14px;
color:#6b7280;
}

/* ================= GRID ================= */

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:16px;
}

/* ================= FORM GROUP ================= */

.form-group{
display:flex;
flex-direction:column;
}

.form-group.full{
grid-column:span 2;
}

.form-group label{
font-size:13px;
font-weight:600;
margin-bottom:6px;
color:#374151;
}

/* ================= INPUT ================= */

.form-group input,
.form-group textarea{
padding:11px 13px;
border:1px solid #e5e7eb;
border-radius:8px;
font-size:14px;
background:#f9fafb;
transition:all .2s;
}

/* FOCUS EFFECT */

.form-group input:focus,
.form-group textarea:focus{
outline:none;
border-color:#2563eb;
background:#ffffff;
box-shadow:0 0 0 3px rgba(37,99,235,0.08);
}

/* ================= TEXTAREA ================= */

textarea{
resize:none;
height:65px;
}

/* ================= BUTTON ================= */

.form-actions{
margin-top:20px;
display:flex;
gap:12px;
}

.btn-save{
background:linear-gradient(135deg,#2563eb,#3b82f6);
color:white;
border:none;
padding:10px 18px;
border-radius:8px;
font-size:14px;
cursor:pointer;
font-weight:600;
transition:0.2s;
}

.btn-save:hover{
transform:translateY(-1px);
box-shadow:0 6px 14px rgba(37,99,235,0.25);
}

.btn-cancel{
background:#e5e7eb;
padding:10px 18px;
border-radius:8px;
font-size:14px;
text-decoration:none;
color:#374151;
font-weight:500;
}

.btn-cancel:hover{
background:#d1d5db;
}
</style>
<div class="page-container">

  <div class="form-card">

    <div class="form-header">
      <h2>Edit Supplier</h2>
      <p>Perbarui data supplier</p>
    </div>

    <form method="POST">
      {% csrf_token %}

      <div class="form-grid">

        <div class="form-group">
          <label>No Pemasok</label>
          <input 
            type="text" 
            name="no_pemasok" 
            value="{{ supplier.no_pemasok }}"
            required
          >
        </div>

        <div class="form-group">
          <label>Nama Supplier</label>
          <input 
            type="text" 
            name="nama_supplier" 
            value="{{ supplier.nama_supplier }}"
            required
          >
        </div>

        <div class="form-group full">
          <label>Alamat</label>
          <textarea name="alamat">{{ supplier.alamat }}</textarea>
        </div>

        <div class="form-group">
          <label>No Telepon</label>
          <input 
            type="text" 
            name="kontak"
            value="{{ supplier.kontak }}"
          >
        </div>

        <div class="form-group full">
          <label>Catatan</label>
          <textarea name="catatan">{{ supplier.catatan }}</textarea>
        </div>

      </div>

      <div class="form-actions">
        <button type="submit" class="btn-save">💾 Update</button>
        <a href="{% url 'supplier' %}" class="btn-cancel">Batal</a>
      </div>

    </form>

  </div>

</div>

{% endblock %}
