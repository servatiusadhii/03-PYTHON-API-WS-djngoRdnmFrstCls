<!doctype html>

<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>{% block title %}Dashboard{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

/* BACKGROUND */

body{
background:linear-gradient(135deg,#eef2ff,#f8fafc);
min-height:100vh;
}



/* ======================
TOPBAR
====================== */

.topbar{

height:70px;
background:rgba(255,255,255,0.85);
backdrop-filter:blur(10px);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 25px;
position:fixed;
width:100%;
z-index:999;
box-shadow:0 6px 25px rgba(0,0,0,0.06);

}

.top-left{

display:flex;
align-items:center;
gap:15px;

}

.menu-btn{

font-size:22px;
cursor:pointer;
color:#334155;

}

.brand{

font-size:18px;
font-weight:600;
color:#1e293b;

}

.top-right{

display:flex;
align-items:center;
gap:20px;

}

.user{

display:flex;
align-items:center;
gap:8px;
font-weight:500;
color:#334155;

}

.logout{

background:linear-gradient(135deg,#ef4444,#dc2626);
color:white;
padding:6px 16px;
border-radius:8px;
text-decoration:none;
font-size:14px;
transition:0.3s;

}

.logout:hover{

transform:translateY(-2px);
box-shadow:0 6px 15px rgba(239,68,68,0.4);

}



/* ======================
SIDEBAR
====================== */

.sidebar{

position:fixed;
top:70px;
left:0;
width:260px;
height:100%;
background:linear-gradient(180deg,#0f172a,#020617);
padding-top:20px;
transition:0.3s;
box-shadow:4px 0 25px rgba(0,0,0,0.15);

}

.sidebar.collapse{

width:85px;

}

.logo{

color:white;
text-align:center;
font-weight:600;
margin-bottom:35px;
font-size:15px;
letter-spacing:0.5px;

}



/* ======================
MENU
====================== */

.menu{

display:flex;
flex-direction:column;
gap:4px;

}

.menu a{

display:flex;
align-items:center;
gap:12px;
padding:13px 20px;
color:#cbd5f1;
text-decoration:none;
border-radius:10px;
margin:4px 10px;
font-size:14px;
transition:all 0.25s ease;

}

.menu a:hover{

background:rgba(59,130,246,0.25);
color:white;
transform:translateX(5px);

}

.menu a.active{

background:linear-gradient(135deg,#2563eb,#3b82f6);
color:white;
box-shadow:0 6px 15px rgba(37,99,235,0.35);

}



/* ======================
DROPDOWN
====================== */

.arrow{

margin-left:auto;
font-size:12px;
transition:0.3s;

}

.dropdown.open .arrow{

transform:rotate(180deg);

}



/* ======================
SUBMENU
====================== */

.submenu{

max-height:0;
overflow:hidden;
transition:0.35s ease;
display:flex;
flex-direction:column;
gap:5px;

}

.submenu.show{

max-height:200px;

}

.submenu a{

padding-left:45px;
font-size:13px;

}



/* ======================
CONTENT AREA
====================== */

.content{

margin-left:260px;
padding:100px 35px;
transition:0.3s;

}

.content.full{

margin-left:85px;

}



/* ======================
CARDS
====================== */

.cards{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:22px;
margin-top:20px;

}

.card{

background:white;
padding:25px;
border-radius:16px;
box-shadow:0 12px 35px rgba(0,0,0,0.05);
transition:0.3s;
position:relative;
overflow:hidden;

}

.card::before{

content:"";
position:absolute;
top:0;
left:0;
height:4px;
width:100%;
background:linear-gradient(90deg,#2563eb,#60a5fa);

}

.card:hover{

transform:translateY(-6px);
box-shadow:0 15px 40px rgba(0,0,0,0.08);

}

.card-title{

font-size:14px;
color:#64748b;

}

.card-value{

font-size:28px;
font-weight:700;
color:#2563eb;
margin-top:5px;

}



/* ======================
CHART BOX
====================== */

.chart-box{

margin-top:30px;
background:white;
padding:25px;
border-radius:16px;
box-shadow:0 12px 35px rgba(0,0,0,0.05);

}



/* ======================
SCROLLBAR
====================== */

::-webkit-scrollbar{

width:6px;

}

::-webkit-scrollbar-thumb{

background:#94a3b8;
border-radius:10px;

}

/* SIDEBAR COLLAPSE */

.sidebar.collapse {
    width: 80px;
}

/* sembunyikan text menu */
.sidebar.collapse span {
    display: none;
}

/* menu jadi center */
.sidebar.collapse .menu a {
    justify-content: center;
}

/* submenu juga sembunyi */
.sidebar.collapse .submenu {
    display: none;
}

/* logo diperkecil */
.sidebar.collapse .logo {
    font-size: 0;
}

/* icon tetap tampil */
.menu i {
    font-size: 18px;
}
    </style>

    {% load static %}

    <link rel="stylesheet" href="{% static 'css/layout.css' %}" />

    {% block extra_css %}{% endblock %}
  </head>

  <body>
    <!-- TOPBAR -->

    <div class="topbar">
      <div class="top-left">
        <div class="menu-btn" onclick="toggleSidebar()">
          <i class="bi bi-list"></i>
        </div>

        <div class="brand">Prediksi Harga Beras</div>
      </div>

      <div class="top-right">
        <div class="user">
          <i class="bi bi-person-circle"></i>
          <span>{{ request.user.username }}</span>
        </div>

        <a href="{% url 'logout' %}" class="logout"> Logout </a>
      </div>
    </div>

    <!-- SIDEBAR -->

    <div class="sidebar" id="sidebar">
      <div class="logo">CV Srikandi Putra Pangan</div>

      <div class="menu">
        <a
          href="{% url 'dashboard' %}"
          class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}"
        >
          <i class="bi bi-speedometer2"></i> <span>Dashboard</span>
        </a>

        <a
          href="{% url 'supplier' %}"
          class="{% if request.resolver_match.url_name == 'supplier' %}active{% endif %}"
        >
          <i class="bi bi-truck"></i> <span>Data Supplier</span>
        </a>

        <a
          href="{% url 'kelola_data' %}"
          class="{% if request.resolver_match.url_name == 'kelola_data' %}active{% endif %}"
        >
          <i class="bi bi-database"></i> <span>Kelola Data</span>
        </a>

        <a
          href="javascript:void(0)"
          class="dropdown"
          onclick="toggleDropdown(this)"
        >
          <i class="bi bi-graph-up"></i>
          <span>Prediksi Harga</span>
          <i class="bi bi-chevron-down arrow"></i>
        </a>

        <div class="submenu">
          <a href="{% url 'prediksi' %}">
            <i class="bi bi-cpu"></i>
            Prediksi
          </a>

          <a href="{% url 'hasil' %}">
            <i class="bi bi-bar-chart"></i>
            Hasil
          </a>
        </div>
      </div>
    </div>

    <!-- CONTENT -->

    <div class="content" id="content">{% block content %} {% endblock %}</div>

    <script>
function toggleSidebar() {

    const sidebar = document.getElementById("sidebar");
    const content = document.getElementById("content");

    sidebar.classList.toggle("collapse");
    content.classList.toggle("full");

}

function toggleDropdown(el) {

    el.classList.toggle("open");

    const submenu = el.nextElementSibling;

    if (submenu) {
        submenu.classList.toggle("show");
    }

}
</script>

    
  </body>
</html>
