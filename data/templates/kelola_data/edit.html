{% extends 'layouts/base.html' %} {% load static %} {% block title %}Edit Data
Kelola{% endblock %} {% block extra_css %}

<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
/>

<style>
  .page-container {
    height: calc(100vh - 70px);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 40px;
  }

  .form-card {
    background: #ffffff;
    border-radius: 18px;
    padding: 28px 35px;
    width: 100%;
    max-width: 1000px;
    box-shadow: 0 18px 45px rgba(0, 0, 0, 0.06);
  }

  .form-title {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 22px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: #0f172a;
  }

  .form-section {
    background: #f8fafc;
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 15px;
  }

  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: #475569;
    margin-bottom: 12px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 20px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
  }

  .form-group label {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 4px;
    color: #334155;
  }

  .input-box {
    position: relative;
  }

  .input-box i {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: #94a3b8;
    font-size: 14px;
  }

  .input-box input,
  .input-box select {
    width: 100%;
    height: 36px;
    padding-left: 32px;
    border-radius: 8px;
    border: 1px solid #e2e8f0;
    font-size: 13px;
    background: white;
  }

  .input-box input:focus,
  .input-box select:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }

  .readonly-input {
    background: #e2e8f0 !important;
    color: #64748b;
  }

  .form-full {
    grid-column: 1 / -1;
  }

  .form-actions {
    margin-top: 15px;
    display: flex;
    gap: 12px;
  }

  .btn-primary {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: white;
    border: none;
    padding: 9px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }

  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 15px rgba(37, 99, 235, 0.35);
  }

  .btn-secondary {
    background: #e2e8f0;
    padding: 9px 18px;
    border-radius: 8px;
    text-decoration: none;
    color: #334155;
    font-weight: 600;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn-secondary:hover {
    background: #cbd5e1;
  }

  @media (max-width: 900px) {
    .page-container {
      align-items: flex-start;
    }

    .form-grid {
      grid-template-columns: 1fr;
    }
  }
</style>

{% endblock %} {% block content %}

<div class="page-container">
  <div class="form-card">
    <div class="form-title">
      <i class="bi bi-pencil-square"></i>
      Edit Data Kelola
    </div>

    <form method="POST">
      {% csrf_token %}

      <div class="form-section">
        <div class="section-title">Informasi Dasar</div>

        <div class="form-grid">
          <div class="form-group">
            <label>Tanggal</label>
            <div class="input-box">
              <i class="bi bi-calendar"></i>
              <input
                type="date"
                name="tanggal"
                value="{{ data.tanggal|date:'Y-m-d' }}"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label>Jenis Beras</label>
            <div class="input-box">
              <i class="bi bi-box"></i>

              <input
                type="text"
                value="Patin"
                readonly
                class="readonly-input"
              />

              <input type="hidden" name="jenis_beras" value="Patin" />
            </div>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="section-title">Informasi Supplier</div>

        <div class="form-grid">
          <div class="form-group">
            <label>Supplier</label>
            <div class="input-box">
              <i class="bi bi-person"></i>

              <select name="supplier" required>
                <option value="">-- Pilih Supplier --</option>

                {% for s in suppliers %}
                <option
                  value="{{ s.id }}"
                  {%
                  if
                  s.id=""
                  ="data.supplier.id"
                  %}selected{%
                  endif
                  %}
                >
                  {{ s.nama_supplier }}
                </option>
                {% endfor %}
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>Kuantitas (kg)</label>
            <div class="input-box">
              <i class="bi bi-box-seam"></i>

              <input
                type="number"
                name="kuantitas_kg"
                value="{{ data.kuantitas_kg }}"
                required
              />
            </div>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="section-title">Informasi Stok</div>

        <div class="form-grid">
          <div class="form-group">
            <label>Stok (kg)</label>
            <div class="input-box">
              <i class="bi bi-archive"></i>

              <input
                type="number"
                name="stok_kg"
                value="{{ data.stok_kg }}"
                required
              />
            </div>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="section-title">Informasi Harga</div>

        <div class="form-grid">
          <div class="form-group form-full">
            <label>Harga per kg (Rp)</label>

            <div class="input-box">
              <i class="bi bi-cash"></i>

              <input
                type="number"
                name="harga_per_kg"
                value="{{ data.harga_per_kg }}"
                required
              />
            </div>
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary">
          <i class="bi bi-check2-square"></i>
          Update Data
        </button>

        <a href="{% url 'kelola_data' %}" class="btn-secondary">
          <i class="bi bi-arrow-left"></i>
          Batal
        </a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
